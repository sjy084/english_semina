<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #eef0ec;
    --paper: #ffffff;
    --ink: #1c211e;
    --ink-2: #5c6560;
    --line: #d5d9d3;
    --ok: #2f6b58;
    --ok-bg: #e2efe9;
    --no: #a83f38;
    --no-bg: #f5e3e1;
    --focus: #2f6b58;
  }
  * { box-sizing: border-box; }
  html { font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0 auto 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); overflow: hidden; }
  .seg button { border: 0; background: none; padding: 7px 12px; font-size: 14px; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .ghost { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 12px; font-size: 14px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 60px; }
  .status { width: 100%; max-width: 560px; display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); margin-bottom: 12px; }
  .bar { width: 100%; max-width: 560px; height: 3px; background: var(--line); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .2s; }

  .card {
    width: 100%; max-width: 560px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 48px 32px 36px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .pos { font-size: 14px; color: var(--ink-2); min-height: 20px; }
  .meaning { font-size: 30px; font-weight: 600; line-height: 1.35; margin: 8px 0 32px; word-break: keep-all; }
  .answer { font-size: 26px; min-height: 40px; letter-spacing: .01em; }
  .answer.hidden { visibility: hidden; }
  .answer.ok { color: var(--ok); }
  .answer.no { color: var(--no); }
  input.type {
    width: 100%; max-width: 320px; padding: 10px 12px; font-size: 20px; text-align: center;
    border: 0; border-bottom: 2px solid var(--line); background: none; border-radius: 0;
  }
  input.type:focus { outline: none; border-bottom-color: var(--ink); }
  input.type.ok { border-bottom-color: var(--ok); color: var(--ok); }
  input.type.no { border-bottom-color: var(--no); color: var(--no); }
  .typed { min-height: 30px; margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .verdict { font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 4px; }
  .verdict.ok { color: var(--ok); background: var(--ok-bg); }
  .verdict.no { color: var(--no); background: var(--no-bg); }
  .correct { font-size: 20px; color: var(--ok); }

  .actions { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 11px 20px; font-size: 15px; min-width: 120px; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .btn.no { background: var(--no-bg); color: var(--no); border-color: transparent; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 20px; }
  kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--paper); }

  .empty { max-width: 560px; text-align: center; color: var(--ink-2); line-height: 1.6; }
  .empty strong { color: var(--ink); font-weight: 600; }
  .empty code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

  @media (max-width: 480px) {
    header { padding: 12px 16px; }
    main { padding: 24px 12px 40px; }
    .card { padding: 36px 20px 28px; }
    .meaning { font-size: 24px; }
    .btn { min-width: 0; flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>단어장</h1>
  <div class="seg" role="group" aria-label="학습 방식">
    <button id="modeCard" aria-pressed="true">카드</button>
    <button id="modeType" aria-pressed="false">쓰기</button>
  </div>
  <div class="seg" role="group" aria-label="범위">
    <button id="scopeAll" aria-pressed="true">전체</button>
    <button id="scopeWeak" aria-pressed="false">몰랐던 것</button>
  </div>
  <button class="ghost" id="shuffle">섞기</button>
  <button class="ghost" id="reset">기록 지우기</button>
</header>

<main>
  <div class="status"><span id="count"></span><span id="score"></span></div>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

  <section class="card" id="card" aria-live="polite">
    <div class="pos" id="pos"></div>
    <div class="meaning" id="meaning"></div>

    <div id="cardView">
      <div class="answer hidden" id="answer"></div>
    </div>

    <div id="typeView" hidden>
      <label class="sr" for="typeInput">영단어 입력</label>
      <input class="type" id="typeInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영단어">
      <div class="typed" id="typed"></div>
    </div>

    <div class="actions" id="actions"></div>
  </section>

  <p class="empty" id="empty" hidden></p>
  <p class="hint" id="hint"></p>
</main>

<script>
(() => {
  const KEY = "vocab-progress";

  let words = [], deck = [], i = 0, mode = "card", scope = "all";
  let revealed = false, graded = null;
  let progress = load();
  let session = { ok: 0, no: 0 };

  const $ = id => document.getElementById(id);

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {} }

  function weakCount() { return Object.values(progress).filter(v => v === "no").length; }
  function refreshWeakCount() {
    const n = weakCount();
    $("scopeWeak").textContent = n ? `몰랐던 것 ${n}` : "몰랐던 것";
  }

  function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

  function buildDeck() {
    deck = scope === "weak" ? words.filter(w => progress[w.word] === "no") : words.slice();
    shuffle(deck);
    i = 0; session = { ok: 0, no: 0 };
    render();
  }

  function current() { return deck[i]; }

  function render() {
    const w = current();
    const card = $("card"), empty = $("empty");
    revealed = false; graded = null;

    if (!w) {
      card.hidden = true; empty.hidden = false;
      if (scope === "weak" && deck.length === 0) {
        empty.innerHTML = "몰랐던 단어가 없습니다.<br>전체 범위에서 학습하며 <strong>몰랐음</strong>으로 표시한 단어가 여기에 모입니다.";
      } else {
        empty.innerHTML = `한 바퀴 끝. 알았음 <strong>${session.ok}</strong>, 몰랐음 <strong>${session.no}</strong><br><br>` +
          `<button class="btn primary" id="again">다시 시작</button>`;
        $("again").onclick = buildDeck;
      }
      $("count").textContent = ""; $("score").textContent = "";
      $("barFill").style.width = "100%";
      $("hint").textContent = "";
      return;
    }
    card.hidden = false; empty.hidden = true;

    $("pos").textContent = w.pos || "";
    $("meaning").textContent = w.meaning;
    $("count").textContent = `${i + 1} / ${deck.length}`;
    $("score").textContent = `알았음 ${session.ok} · 몰랐음 ${session.no}`;
    $("barFill").style.width = `${(i / deck.length) * 100}%`;

    $("cardView").hidden = mode !== "card";
    $("typeView").hidden = mode !== "type";

    if (mode === "card") {
      const a = $("answer");
      a.textContent = w.word; a.className = "answer hidden";
      setActions([{ t: "정답 보기", c: "primary", f: reveal }]);
      $("hint").innerHTML = "<kbd>Space</kbd> 정답 보기 · <kbd>1</kbd> 몰랐음 · <kbd>2</kbd> 알았음 · <kbd>S</kbd> 섞기";
    } else {
      const inp = $("typeInput");
      inp.value = ""; inp.className = "type"; inp.disabled = false; $("typed").innerHTML = "";
      setActions([{ t: "확인", c: "primary", f: grade }]);
      $("hint").innerHTML = "<kbd>Enter</kbd> 확인, 한 번 더 눌러 다음 · <kbd>S</kbd> 섞기";
      inp.focus();
    }
  }

  function setActions(list) {
    const box = $("actions"); box.innerHTML = "";
    for (const b of list) {
      const el = document.createElement("button");
      el.className = "btn " + b.c; el.textContent = b.t; el.onclick = b.f;
      box.appendChild(el);
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    $("answer").classList.remove("hidden");
    setActions([{ t: "몰랐음", c: "no", f: () => mark("no") }, { t: "알았음", c: "ok", f: () => mark("ok") }]);
  }

  function mark(r) {
    const w = current(); if (!w) return;
    progress[w.word] = r; save(); refreshWeakCount();
    session[r]++;
    i++; render();
  }

  function norm(s) { return s.trim().toLowerCase().replace(/\s+/g, " "); }

  function grade() {
    if (graded) return;
    const w = current(), inp = $("typeInput");
    const ok = norm(inp.value) === norm(w.word);
    graded = ok ? "ok" : "no";
    inp.disabled = true; inp.classList.add(graded);
    $("typed").innerHTML = ok
      ? `<span class="verdict ok">맞음</span>`
      : `<span class="verdict no">틀림</span><span class="correct">${w.word}</span>`;
    progress[w.word] = graded; save(); refreshWeakCount(); session[graded]++;
    setActions([{ t: "다음", c: "primary", f: () => { i++; render(); } }]);
    $("actions").querySelector("button").focus();
  }

  function setMode(m) {
    mode = m;
    $("modeCard").setAttribute("aria-pressed", m === "card");
    $("modeType").setAttribute("aria-pressed", m === "type");
    render();
  }
  function setScope(s) {
    scope = s;
    $("scopeAll").setAttribute("aria-pressed", s === "all");
    $("scopeWeak").setAttribute("aria-pressed", s === "weak");
    refreshWeakCount();
    buildDeck();
  }

  $("modeCard").onclick = () => setMode("card");
  $("modeType").onclick = () => setMode("type");
  $("scopeAll").onclick = () => setScope("all");
  $("scopeWeak").onclick = () => setScope("weak");
  $("shuffle").onclick = buildDeck;
  $("reset").onclick = () => {
    const n = Object.keys(progress).length;
    if (n === 0) return;
    if (!confirm(`${n}개 단어의 학습 기록을 지웁니다. 계속할까요?`)) return;
    progress = {}; save(); setScope("all");
  };
  $("typeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); grade(); }
  });

  document.addEventListener("keydown", e => {
    const t = e.target.tagName;
    if (t === "INPUT" || t === "BUTTON") return;
    if (!current()) return;
    if (mode === "card") {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); revealed ? mark("ok") : reveal(); }
      else if (e.key === "1" && revealed) mark("no");
      else if (e.key === "2" && revealed) mark("ok");
    } else if (e.key === "Enter" && graded) { e.preventDefault(); i++; render(); }
    if (e.key === "s" || e.key === "S") buildDeck();
  });

  function fail(title, detail) {
    $("card").hidden = true;
    const e = $("empty"); e.hidden = false;
    e.innerHTML = `<strong>${title}</strong><br>${detail}`;
    $("count").textContent = ""; $("score").textContent = "";
    $("hint").textContent = "";
  }

  fetch("words.json", { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.text();
    })
    .then(t => {
      let d;
      try { d = JSON.parse(t); }
      catch (err) {
        return fail("words.json을 읽을 수 없습니다",
          `JSON 문법 오류입니다. 마지막 항목 뒤의 쉼표나 짝이 안 맞는 따옴표를 확인하세요.<br><br>${err.message}`);
      }
      if (!Array.isArray(d) || d.length === 0) {
        return fail("words.json이 비어 있습니다", "단어 목록은 대괄호로 감싼 배열이어야 합니다.");
      }
      words = d.filter(w => w && w.word && w.meaning);
      if (words.length === 0) {
        return fail("쓸 수 있는 단어가 없습니다", "각 항목에 word와 meaning이 모두 있어야 합니다.");
      }
      buildDeck();
    })
    .catch(err => {
      const local = location.protocol === "file:";
      fail("words.json을 불러오지 못했습니다",
        local
          ? "파일을 직접 열면 브라우저가 words.json을 읽지 못합니다.<br>GitHub Pages 주소로 접속하거나, 폴더에서 <code>python3 -m http.server</code>를 실행한 뒤 <code>localhost:8000</code>으로 여세요."
          : `words.json이 index.html과 같은 폴더에 있는지 확인하세요.<br><br>${err.message}`);
    });
})();
</script>
</body>
</html>
